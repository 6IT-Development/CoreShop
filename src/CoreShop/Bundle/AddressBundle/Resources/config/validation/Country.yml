CoreShop\Component\Address\Model\Country:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [isoCode]
            groups: [coreshop]
    properties:
        isoCode:
            - NotBlank: { groups: [coreshop] }
        active:
            - Type: { type: boolean, groups: [coreshop] }
        addressFormat:
            - NotBlank: { groups: [coreshop] }
            - CoreShop\Bundle\AddressBundle\Validator\Constraints\ValidAddressFormat: { groups: [coreshop] }
        translations:
            - Valid: ~
