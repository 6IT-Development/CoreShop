CoreShop\Component\Address\Model\State:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [country, isoCode]
            errorPath: isoCode
            groups: [coreshop]
    properties:
        country:
            - NotBlank: { groups: [coreshop] }
        isoCode:
            - NotBlank: { groups: [coreshop] }
        active:
            - Type: { type: boolean, groups: [coreshop] }
        translations:
            - Valid: ~
